let renderedCardIds = new Set();
let renderCache = {};

    // ----- RENDER -----
    function renderMovies(moviesToRender, totalFilteredCount) {
        const grid = document.getElementById('movieGrid');
        grid.innerHTML = '';
        const countIndicator = document.getElementById('movieCountIndicator');
        if (countIndicator) {
            const total = movies.length;
            countIndicator.textContent = total === totalFilteredCount ? `${total} item${total===1?'':'s'}` : `${totalFilteredCount} of ${total} items`;
        }
        if (moviesToRender.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-20 text-neutral-600"><p class="text-base font-light">No items match.</p><p class="text-xs font-light">Adjust filters or search.</p></div>`;
            return;
        }
        moviesToRender.forEach(movie => {
            const isSelected = selectedItems.has(movie.id);
            const isBulkSelected = bulkSelection.has(movie.id);
            const card = document.createElement('div');
            card.className = `movie-card bg-neutral-900/40 rounded-xl overflow-hidden border ${isSelected ? 'border-sky-500/80 ring-2 ring-sky-500/30' : 'border-neutral-800/60'} ${isBulkSelected ? 'bulk-selected' : ''} flex flex-col justify-between hover:border-neutral-700 transition duration-300 group`;
            card.dataset.movieId = movie.id;
            
            card.draggable = reorderMode;
            
            card.addEventListener('dragstart', (e) => {
                if (!reorderMode) return;
                e.dataTransfer.effectAllowed = 'move';
                if (bulkSelection.size > 1 && bulkSelection.has(movie.id)) {
                    const selectedIds = Array.from(bulkSelection);
                    e.dataTransfer.setData('text/plain', JSON.stringify(selectedIds));
                    document.querySelectorAll('.movie-card.bulk-selected').forEach(el => {
                        el.classList.add('bulk-dragging');
                    });
                    isBulkDragging = true;
                } else {
                    e.dataTransfer.setData('text/plain', String(movie.id));
                    isBulkDragging = false;
                }
                card.classList.add('dragging');
            });
            
            card.addEventListener('dragend', (e) => {
                if (!reorderMode) return;
                card.classList.remove('dragging');
                document.querySelectorAll('.movie-card.drag-over, .movie-card.drag-over-bulk').forEach(el => {
                    el.classList.remove('drag-over', 'drag-over-bulk');
                });
                document.querySelectorAll('.movie-card.bulk-dragging').forEach(el => {
                    el.classList.remove('bulk-dragging');
                });
                isBulkDragging = false;
                saveOrderFromDOM();
                filterAndSortMovies();
                setTimeout(() => updateBulkVisuals(), 50);
            });
            
            card.addEventListener('dragover', (e) => {
                if (!reorderMode) return;
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                
                const dragDataStr = e.dataTransfer.getData('text/plain');
                let isBulk = false;
                try {
                    const parsed = JSON.parse(dragDataStr);
                    if (Array.isArray(parsed) && parsed.length > 1) isBulk = true;
                } catch (err) {}
                
                document.querySelectorAll('.movie-card.drag-over, .movie-card.drag-over-bulk').forEach(el => {
                    el.classList.remove('drag-over', 'drag-over-bulk');
                });
                
                if (isBulk && bulkSelection.size > 1) {
                    card.classList.add('drag-over-bulk');
                } else {
                    card.classList.add('drag-over');
                }
            });
            
            card.addEventListener('dragleave', (e) => {
                if (!reorderMode) return;
                card.classList.remove('drag-over', 'drag-over-bulk');
            });
            
            card.addEventListener('drop', (e) => {
                if (!reorderMode) return;
                e.preventDefault();
                card.classList.remove('drag-over', 'drag-over-bulk');
                
                const dragDataStr = e.dataTransfer.getData('text/plain');
                let draggedIds = [];
                try {
                    const parsed = JSON.parse(dragDataStr);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        draggedIds = parsed;
                    } else if (typeof parsed === 'number') {
                        draggedIds = [parsed];
                    }
                } catch (err) {
                    const singleId = parseInt(dragDataStr);
                    if (!isNaN(singleId)) {
                        draggedIds = [singleId];
                    }
                }
                
                if (draggedIds.length === 0) return;
                if (draggedIds.length === 1 && draggedIds[0] === movie.id) return;
                
                const draggedIdSet = new Set(draggedIds);
                const moviesToMove = movies.filter(m => draggedIdSet.has(m.id));
                if (moviesToMove.length === 0) return;
                
                const targetIndex = movies.findIndex(m => m.id === movie.id);
                if (targetIndex === -1) return;
                
                const remainingMovies = movies.filter(m => !draggedIdSet.has(m.id));
                const newMovies = [];
                let inserted = false;
                for (let i = 0; i < remainingMovies.length; i++) {
                    if (i === targetIndex && !inserted) {
                        newMovies.push(...moviesToMove);
                        inserted = true;
                    }
                    newMovies.push(remainingMovies[i]);
                }
                if (!inserted) {
                    newMovies.push(...moviesToMove);
                }
                movies = newMovies;
                saveToLocalStorage();
                filterAndSortMovies();
                setTimeout(() => updateBulkVisuals(), 50);
            });
            
            card.onclick = (e) => {
                if (e.target.closest('button') || e.target.closest('textarea') || e.target.closest('select') || e.target.closest('input')) {
                    return;
                }
                if (reorderMode) {
                    toggleBulkSelection(movie.id);
                    return;
                }
                if (selectMode || isSelected) {
                    toggleSelect(movie.id);
                }
            };
            card.ondblclick = (e) => {
                if (e.target.closest('button') || e.target.closest('textarea') || e.target.closest('select') || e.target.closest('input')) {
                    return;
                }
                if (reorderMode) return;
                if (!selectMode && !isSelected) {
                    selectMode = true;
                    toggleSelect(movie.id);
                }
            };
            
            // Updated status badge colors for 3 states - RED for Not Finished
            let statusBadgeClass = 'bg-neutral-800/60 text-neutral-400 border-neutral-700/50';
            if (movie.watchStatus === 'Watched') {
                statusBadgeClass = 'bg-emerald-950/60 text-emerald-300 border-emerald-900/50';
            } else if (movie.watchStatus === 'Not Finished') {
                statusBadgeClass = 'bg-red-950/60 text-red-300 border-red-900/50';
            }
            
            const itemType = movie.mediaType || 'movie';
            const typeLabel = itemType === 'series' ? 'TV Series' : 'Movie';
            const typeBadgeClass = itemType === 'series' ? 'bg-amber-950/80 text-amber-300 border-amber-800/80' : 'bg-neutral-950/80 text-neutral-300 border-neutral-800';
            const safeGenres = Array.isArray(movie.genres) ? movie.genres : ['Unknown'];
            const commentText = movie.comment || '';
            const customTags = Array.isArray(movie.customTags) ? movie.customTags : [];

            const tagsHtml = customTags.map(t => {
                const color = getTagColor(t);
                return `<span onclick="toggleTagFromCard('${t}')" 
                             oncontextmenu="event.preventDefault(); changeTagColor('${t}')" 
                             class="${color.bg} ${color.border} ${color.text} text-[10px] px-2 py-0.5 rounded-full border font-light cursor-pointer transition hover:brightness-110"
                             title="Click to filter | Right-click to change color">#${t}</span>`;
            }).join('');

            const genresHtml = safeGenres.map(g => `
                <span onclick="toggleGenreFromCard('${g}')" 
                      class="bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-neutral-400 hover:text-neutral-200 text-[10px] px-2 py-0.5 rounded-full font-light cursor-pointer transition">
                    ${g}
                </span>
            `).join('');

            if (reorderMode) {
                card.innerHTML = `
                    <div class="relative overflow-hidden aspect-[2/3] bg-neutral-950 flex items-center justify-center card-poster">
                        <img src="${movie.poster}" alt="${movie.title}" class="w-full h-full object-cover" />
                        <div class="absolute bottom-3 right-3 bg-neutral-950/80 backdrop-blur-md px-3 py-1 rounded-full text-xs font-medium text-neutral-200 border border-neutral-800">
                            ${movie.year}
                        </div>
                        <div class="absolute top-2 left-2 drag-handle text-2xl text-neutral-400">⠿</div>
                        <div class="bulk-check">✓</div>
                    </div>
                    <div class="p-2 text-center movie-title">${movie.title}</div>
                `;
            } else {
                card.innerHTML = `
                    <div class="relative overflow-hidden aspect-[2/3] bg-neutral-950 flex items-center justify-center card-poster">
                        <img src="${movie.poster}" alt="${movie.title}" class="w-full h-full object-cover group-hover:scale-102 transition duration-500">
                        
                        <button onclick="event.stopPropagation(); editPoster(${movie.id})" 
                                class="poster-edit-btn absolute top-2 left-2 bg-neutral-950/80 backdrop-blur-md p-2 rounded-full border border-neutral-700 hover:border-neutral-400 transition shadow-lg">
                            <svg class="w-4 h-4 text-neutral-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                        </button>

                       <div class="absolute bottom-3 right-3 bg-neutral-950/80 backdrop-blur-md px-3 py-1 rounded-full text-xs font-medium text-neutral-200 border border-neutral-800 hover:border-neutral-500 transition shadow-sm flex items-center gap-1.5 cursor-default">
    <span>${movie.year}</span>
    <button onclick="event.stopPropagation(); editYear(${movie.id})" 
            class="year-edit-btn text-neutral-500 hover:text-neutral-200 transition">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
        </svg>
    </button>
</div>

                        <div onclick="editRating(${movie.id})" class="absolute top-3 right-3 bg-neutral-950/80 backdrop-blur-md px-3 py-1 rounded-full text-xs font-medium text-neutral-200 border border-neutral-800 hover:border-neutral-500 cursor-pointer transition flex items-center gap-1 shadow-sm"><span>⭐</span><span><strong class="text-white">${movie.personalRating}</strong>/10</span></div>
                        
                        <div class="absolute inset-x-0 bottom-0 h-1/2 bg-neutral-950/90 backdrop-blur-md p-3 flex flex-col justify-between ${selectMode ? 'opacity-0 pointer-events-none' : 'opacity-0 group-hover:opacity-100'} transition-opacity duration-300 border-t border-neutral-800/85">
                            <div class="flex flex-col h-full">
                                <textarea id="commentInput_${movie.id}" oninput="handleCommentInput(${movie.id})" placeholder="Add private notes..." onclick="event.stopPropagation()" class="w-full flex-grow bg-neutral-900 border border-neutral-800 rounded-lg p-2.5 text-xs text-neutral-100 placeholder-neutral-600 focus:outline-none focus:border-neutral-500 resize-none transition mb-2 cursor-default"></textarea>
                                <button id="saveCommentBtn_${movie.id}" onclick="saveComment(${movie.id}, event)" class="hidden w-full bg-neutral-100 hover:bg-white text-neutral-950 text-xs py-1.5 rounded-lg font-medium transition shadow-sm">Save Comment</button>
                            </div>
                        </div>
                    </div>

                    <div class="p-4 flex flex-col flex-grow justify-between">
                        <div>
                           <div class="mb-1">
                                <div class="flex items-center gap-1 mb-0.5">
                                    <span class="drag-handle text-neutral-500 mr-1">⠿</span>
                                    <h3 class="font-medium text-sm text-neutral-200 tracking-tight line-clamp-1 flex-1">
                                        ${movie.title}
                                    </h3>
                                    <button onclick="event.stopPropagation(); editTitle(${movie.id})" 
                                            class="title-edit-btn text-[10px] px-1.5 py-0.5 rounded-full border border-dashed border-neutral-700 text-neutral-500 hover:text-neutral-300 hover:border-neutral-500 transition font-light flex items-center gap-0.5 flex-shrink-0">
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                                        </svg>
                                    </button>
                                </div>
                                <div class="flex flex-wrap items-center gap-1">
                                    <span onclick="toggleMediaType(${movie.id})" class="inline-block cursor-pointer px-2.5 py-0.5 rounded text-[10px] font-medium border transition-all duration-200 hover:opacity-80 shadow-sm ${typeBadgeClass}">
                                        ${typeLabel}
                                    </span>
                                    <button onclick="toggleStatus(${movie.id})" class="text-[10px] px-2 py-0.5 rounded border ${statusBadgeClass} transition cursor-pointer">${movie.watchStatus}</button>
                                </div>

                                <div class="mt-1"> 
                                    ${(movie.mediaType === 'series') ? `
                                    <span class="text-[10px] text-neutral-500 font-light flex items-center gap-0.5">
                                        <span>S: 
                                            <span id="seasons_display_${movie.id}" class="season-display text-neutral-300 font-mono">${movie.seasons || 99}</span>
                                            <input type="number" id="seasons_input_${movie.id}" 
                                                   value="${movie.seasons || 99}" 
                                                   min="1" max="999"
                                                   onchange="updateSeasonCount(${movie.id})"
                                                   onclick="event.stopPropagation()"
                                                   class="season-input w-10 bg-neutral-900 border border-neutral-700 rounded px-1 py-0 text-xs text-neutral-100 focus:outline-none focus:border-neutral-500 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                                        </span>
                                        <span class="text-neutral-700">|</span>
                                        <span>E: 
                                            <span id="episodes_display_${movie.id}" class="episode-display text-neutral-300 font-mono">${movie.episodes || 99}</span>
                                            <input type="number" id="episodes_input_${movie.id}" 
                                                   value="${movie.episodes || 99}" 
                                                   min="1" max="999"
                                                   onchange="updateEpisodeCount(${movie.id})"
                                                   onclick="event.stopPropagation()"
                                                   class="episode-input w-10 bg-neutral-900 border border-neutral-700 rounded px-1 py-0 text-xs text-neutral-100 focus:outline-none focus:border-neutral-500 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                                        </span>
                                        <span class="relative inline-flex items-center">
                                            <button onclick="event.stopPropagation(); refreshSeasonsEpisodes(${movie.id})" 
                                                    class="absolute left-0 top-1/2 -translate-y-1/2 ml-0.5 px-1 py-0.5 bg-neutral-800 hover:bg-neutral-700 rounded text-neutral-300 hover:text-white transition text-[9px] flex items-center gap-0.5 season-refresh-btn">
                                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                                            </button>
                                        </span>
                                    </span>
                                    ` : ''}
                                </div>

                                <hr class="mt-1.5 border-neutral-800">
                            </div>
                            <div class="flex flex-wrap gap-1 mb-1 items-center">
                                ${genresHtml}
                                <button onclick="event.stopPropagation(); editGenres(${movie.id})" 
                                        class="genre-edit-btn text-[10px] px-2 py-0.5 rounded-full border border-dashed border-neutral-700 text-neutral-500 hover:text-neutral-300 hover:border-neutral-500 transition font-light items-center gap-1">
                                    ✎ Edit
                                </button>
                            </div>
                            ${customTags.length ? `<div class="flex flex-wrap gap-1 mb-2">${tagsHtml}</div>` : `<div class="text-[10px] text-neutral-600 italic mb-2"></div>`}
                         
                        </div>
                        <div class="flex items-center gap-2 mt-1">
                            <button onclick="editTags(${movie.id})" class="flex-1 bg-neutral-800/50 hover:bg-neutral-700 text-neutral-300 hover:text-white border border-neutral-700/50 text-xs py-1.5 rounded-lg transition font-light flex items-center justify-center gap-1">
                                <span>✎</span> Edit Tags
                            </button>
                            <button onclick="removeMovie(${movie.id})" class="flex-1 bg-transparent hover:bg-neutral-900 text-neutral-500 hover:text-red-400 border border-neutral-800/80 text-xs py-1.5 rounded-lg transition font-light">Remove</button>
                        </div>
                    </div>
                `;
                const textarea = card.querySelector(`#commentInput_${movie.id}`);
                if (textarea) textarea.value = commentText;
            }
            grid.appendChild(card);
        });
    }

    // ----- TAG/HELPER FUNCTIONS -----
    function toggleTagFromCard(tag) {
        if (excludedTags.has(tag)) excludedTags.delete(tag);
        if (selectedTags.has(tag)) selectedTags.delete(tag);
        else selectedTags.add(tag);
        currentPage = 1;
        updateFilterUIs();
        filterAndSortMovies();
        showStatus(`Filter by tag: ${tag}`, "info");
    }

    function toggleGenreFromCard(genre) {
        if (excludedGenres.has(genre)) excludedGenres.delete(genre);
        if (selectedGenres.has(genre)) selectedGenres.delete(genre);
        else selectedGenres.add(genre);
        currentPage = 1;
        updateFilterUIs();
        filterAndSortMovies();
        showStatus(`Filter by genre: ${genre}`, "info");
    }

    function handleSearchInput() { currentPage = 1; filterAndSortMovies(); }
    function handleFilterChange() { currentPage = 1; filterAndSortMovies(); }
    function changeItemsPerPage() {
        if (reorderMode) return;
        const val = document.getElementById('itemsPerPageSelect').value;
        itemsPerPage = val === 'all' ? 'all' : parseInt(val);
        currentPage = 1;
        filterAndSortMovies();
    }
    function goToPage(page) { currentPage = page; filterAndSortMovies(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    
    function toggleStatus(id) {
        const movie = movies.find(m => m.id === id);
        if (!movie) return;
        // Cycle through: Want to Watch -> Watched -> Not Finished -> Want to Watch
        if (movie.watchStatus === 'Watched') {
            movie.watchStatus = 'Not Finished';
        } else if (movie.watchStatus === 'Not Finished') {
            movie.watchStatus = 'Want to Watch';
        } else {
            movie.watchStatus = 'Watched';
        }
        saveToLocalStorage();
        filterAndSortMovies();
        showStatus(`Marked "${movie.title}" as ${movie.watchStatus}.`, "info");
    }
    
    function toggleMediaType(id) {
        const movie = movies.find(m => m.id === id);
        if (!movie) return;
        movie.mediaType = movie.mediaType === 'movie' ? 'series' : 'movie';
        saveToLocalStorage();
        filterAndSortMovies();
        showStatus(`Changed "${movie.title}" to ${movie.mediaType}.`, "info");
    }
    
    function editRating(id) {
        const movie = movies.find(m => m.id === id);
        if (!movie) return;
        const newRating = prompt(`Update rating for "${movie.title}" (0-10):`, movie.personalRating);
        if (newRating === null) return;
        const val = parseFloat(newRating);
        if (isNaN(val) || val < 0 || val > 10) { showStatus("Enter number 0-10.", "error"); return; }
        movie.personalRating = val;
        saveToLocalStorage();
        filterAndSortMovies();
        showStatus(`Rating updated for "${movie.title}".`, "success");
    }
    
    function handleCommentInput(id) {
        const movie = movies.find(m => m.id === id);
        if (!movie) return;
        const input = document.getElementById(`commentInput_${id}`);
        const btn = document.getElementById(`saveCommentBtn_${id}`);
        if (!input || !btn) return;
        btn.classList.toggle('hidden', input.value.trim() === (movie.comment || '').trim());
    }
    
    function saveComment(id, e) {
        e.stopPropagation();
        const movie = movies.find(m => m.id === id);
        if (!movie) return;
        const input = document.getElementById(`commentInput_${id}`);
        if (!input) return;
        movie.comment = input.value.trim();
        saveToLocalStorage();
        document.getElementById(`saveCommentBtn_${id}`)?.classList.add('hidden');
        showStatus(`Comment saved for "${movie.title}".`, "success");
    }
    
    function removeMovie(id) {
        const movie = movies.find(m => m.id === id);
        if (!movie) return;
        if (confirm(`Remove "${movie.title}"?`)) {
            movies = movies.filter(m => m.id !== id);
            if (selectedItems.has(id)) selectedItems.delete(id);
            bulkSelection.delete(id);
            saveToLocalStorage();
            updateFilterUIs();
            filterAndSortMovies();
            showStatus("Item removed.", "info");
        }
    }
    
    function showStatus(msg, type) {
        if (editMode) return;
        const el = document.getElementById('statusMessage');
        el.classList.remove('hidden','bg-red-950/40','text-red-300','border-red-900/50','bg-emerald-950/40','text-emerald-300','border-emerald-900/50','bg-neutral-900','text-neutral-300','border-neutral-800');
        if (type === 'error') el.classList.add('bg-red-950/40','text-red-300','border','border-red-900/50');
        else if (type === 'success') el.classList.add('bg-emerald-950/40','text-emerald-300','border','border-emerald-900/50');
        else el.classList.add('bg-neutral-900','text-neutral-300','border','border-neutral-800');
        el.textContent = msg;
        setTimeout(() => { if (type !== 'error') el.classList.add('hidden'); }, 4000);
    }
    
    function resetFilters() {
        const currentSort = document.getElementById('ratingSort').value;
        document.getElementById('movieTitleInput').value = "";
        document.getElementById('searchInput').value = '';
        selectedGenres.clear(); excludedGenres.clear();
        selectedTags.clear(); excludedTags.clear();
        document.getElementById('statusFilter').value = 'all';
        localStorage.removeItem('cinevault_status_pref');
        document.getElementById('typeFilter').value = 'all';
        document.getElementById('ratingRangeInput').value = '';
        localStorage.removeItem('cinevault_rating_range_pref');
        document.getElementById('yearRangeInput').value = '';
        document.getElementById('ratingSort').value = 'none';
        localStorage.removeItem('cinevault_sort_pref');
        document.getElementById('ratingSort').value = currentSort;
        localStorage.setItem('cinevault_sort_pref', currentSort);
        if (reorderMode && currentSort !== 'latest') {
            document.getElementById('ratingSort').value = 'none';
            wasLatestMode = false;
        } else if (reorderMode && currentSort === 'latest') {
            wasLatestMode = true;
        }
        document.getElementById('itemsPerPageSelect').value = '12';
        itemsPerPage = 12;
        currentPage = 1;
        clearBulkSelection();
        updateFilterUIs();
        filterAndSortMovies();
        showStatus("Filters reset.", "info");
    }
    
    function exportData() {
        const data = {
            movies: movies,
            tagColors: Array.from(tagColorMap.entries())
        };
        showProgress("Preparing JSON...", 10);
        setTimeout(() => {
            showProgress("Generating JSON...", 40);
            const jsonData = JSON.stringify(data, null, 4);
            const blob = new Blob([jsonData], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            setTimeout(() => {
                showProgress("Creating download...", 70);
                const a = document.createElement('a');
                a.setAttribute("href", url);
                a.setAttribute("download", "cinevault_data.json");
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showProgress("Download complete!", 100);
                    setTimeout(() => {
                        hideProgress();
                        showStatus("Exported JSON successfully!", "success");
                    }, 500);
                }, 300);
            }, 150);
        }, 150);
    }
    
    function importData(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const imported = JSON.parse(ev.target.result);
                if (Array.isArray(imported)) {
                    movies = imported.map(m => ({ ...m, mediaType: m.mediaType || 'movie', comment: m.comment || '', customTags: Array.isArray(m.customTags) ? m.customTags : [], seasons: m.seasons || 99, episodes: m.episodes || 99, currentSeason: m.currentSeason || 1, currentEpisode: m.currentEpisode || 1 }));
                } else if (imported.movies && Array.isArray(imported.movies)) {

    function renderPagination(total) {
        const container = document.getElementById('paginationButtons');
        container.innerHTML = '';
        document.getElementById('paginationContainer').style.display = 'flex';
        if (itemsPerPage === 'all' || reorderMode) { 
            container.innerHTML = `<span class="text-xs text-neutral-500">Showing all ${total} items</span>`; 
            return; 
        }
        const totalPages = Math.ceil(total / itemsPerPage);
        if (totalPages <= 1) { document.getElementById('paginationContainer').style.display = 'none'; return; }
        const prev = document.createElement('button');
        prev.textContent = 'Prev';
        prev.className = `px-3 py-1.5 rounded-lg text-xs font-light border transition ${currentPage===1?'bg-neutral-950 text-neutral-600 border-neutral-900 cursor-not-allowed':'bg-neutral-900 text-neutral-300 border-neutral-800 hover:bg-neutral-800'}`;
        prev.disabled = currentPage===1;
        prev.onclick = () => { if (currentPage > 1) goToPage(currentPage-1); };
        container.appendChild(prev);
        for (let i=1; i<=totalPages; i++) {
            if (i===1 || i===totalPages || (i>=currentPage-1 && i<=currentPage+1)) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = `px-3 py-1.5 rounded-lg text-xs transition border ${i===currentPage?'bg-neutral-100 text-neutral-950 border-neutral-100 font-medium':'bg-neutral-900 text-neutral-400 border-neutral-800 hover:border-neutral-700 hover:text-neutral-200'}`;
                btn.onclick = () => goToPage(i);
                container.appendChild(btn);
            } else if (i===currentPage-2 || i===currentPage+2) {
                const ellipsis = document.createElement('span');
                ellipsis.textContent = '...';
                ellipsis.className = 'px-2 text-xs text-neutral-600';
                container.appendChild(ellipsis);
            }
        }
        const next = document.createElement('button');
        next.textContent = 'Next';
        next.className = `px-3 py-1.5 rounded-lg text-xs font-light border transition ${currentPage===totalPages?'bg-neutral-950 text-neutral-600 border-neutral-900 cursor-not-allowed':'bg-neutral-900 text-neutral-300 border-neutral-800 hover:bg-neutral-800'}`;
        next.disabled = currentPage===totalPages;
        next.onclick = () => { if (currentPage < totalPages) goToPage(currentPage+1); };
        container.appendChild(next);
    }

    async function printPDF() {

                const startIdx = pageIdx*itemsPerPDFPage;

                        statusBg = '#2a0a0a';
                        statusText = '#ef4444';
                        statusBorder = '#7f1d1d';
                    }

                    const typeBg = isSeries ? '#3b2207' : '#18181c';

            element.style.display = 'block';
            const opt = { margin:0, filename:'cinevault_collection.pdf', image:{type:'jpeg',quality:1}, html2canvas:{scale:2,useCORS:true,allowTaint:false,backgroundColor:'#0b0b0d',logging:false,letterRendering:true,scrollX:0,scrollY:0}, jsPDF:{unit:'mm',format:'a4',orientation:'portrait',compress:true} };

                const pdfObject = await html2pdf().from(element).set(opt).toPdf().get('pdf');
                const totalPagesInPdf = pdfObject.internal.getNumberOfPages();
                if (totalPagesInPdf > totalBatchPages) pdfObject.deletePage(totalBatchPages);
                const blob = pdfObject.output('blob');
                pdfBlobs.push(blob);
                const progress = Math.round(((batchIdx + 1) / totalBatches) * 100);
                showProgress("Generating PDF...", progress);
            } catch (err) { 
                element.style.display = 'none'; 
                hideProgress();
                showStatus("PDF error. Check CORS.", "error"); 
                console.error(err); 
                return; 
            }
            element.style.display = 'none';
        }
        try {
            showProgress("Merging PDF pages...", 90);
            const { PDFDocument } = PDFLib;
            const mergedPdf = await PDFDocument.create();
            for (const blob of pdfBlobs) {
                const arrayBuffer = await blob.arrayBuffer();
                const pdfDoc = await PDFDocument.load(arrayBuffer);
                const pages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
                pages.forEach(p => mergedPdf.addPage(p));
            }
            const mergedBytes = await mergedPdf.save();
            const downloadBlob = new Blob([mergedBytes], { type: 'application/pdf' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(downloadBlob);
            link.download = 'cinevault_collection.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);

            showProgress("PDF exported successfully!", 100);
            setTimeout(() => {
                hideProgress();
                showStatus("PDF exported successfully!", "success");
            }, 500);
        } catch (err) { 
            hideProgress();
            showStatus("Merge failed.", "error"); 
            console.error(err); 
        }
    }

    function getActiveGenresOrTags() {
        const result = [];
        if (selectedGenres.size) result.push(...Array.from(selectedGenres));
        else if (excludedGenres.size) result.push(...Array.from(excludedGenres).map(g => `not ${g}`));
        if (selectedTags.size) result.push(...Array.from(selectedTags).map(t => `#${t}`));
        else if (excludedTags.size) result.push(...Array.from(excludedTags).map(t => `not #${t}`));
        if (!result.length) result.push('All');
        return result.slice(0, 6);
    }
